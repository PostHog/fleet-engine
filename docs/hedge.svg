<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">What Hedge sets up</title>
  <desc id="desc">Your Mac and your phone run only the T3 Code app. It links to your nodes in the cloud, where agent threads work in their own worktrees. Your hub in the cloud links the nodes and keeps the secrets of your packs. Every cloud box reads the same private profile repo on GitHub.</desc>
  <style>
    svg { --bg: #eeefe9; --surface: #fdfdf8; --sunk: #e5e7e0; --fg: #151515; --muted: #5c5d56; --accent: #1d4aff; font-family: "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) { svg { --bg: #151515; --surface: #1f1f1f; --sunk: #2c2c2c; --fg: #eeefe9; --muted: #a9aaa2; --accent: #8aa2ff; } }
    .bg { fill: var(--bg); }
    .node { fill: var(--surface); stroke: var(--fg); stroke-width: 1.5; }
    .sub { fill: var(--sunk); }
    .txt { fill: var(--fg); font-size: 14px; font-weight: 600; }
    .small { fill: var(--muted); font-size: 12px; }
    .mono { fill: var(--fg); font: 11px ui-monospace, Menlo, monospace; }
    .link { stroke: var(--accent); stroke-width: 2; fill: none; }
    .optlink { stroke: var(--muted); stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .lbl { fill: var(--accent); font-size: 12px; font-weight: 600; }
  </style>
  <rect class="bg" width="760" height="330" rx="14"/>
  <rect class="node" x="20" y="40" width="200" height="130" rx="12"/>
  <text class="txt" x="38" y="68">Your Mac or phone</text>
  <rect class="sub" x="38" y="82" width="164" height="34" rx="6"/><text class="mono" x="50" y="104">T3 Code app</text>
  <text class="small" x="38" y="140">You read and steer your</text><text class="small" x="38" y="156">agents here. Nothing else.</text>
  <path class="link" d="M220 105 H310"/><text class="lbl" x="228" y="95">T3 Connect</text>
  <rect class="node" x="310" y="22" width="250" height="170" rx="12"/>
  <text class="txt" x="328" y="50">Your nodes, in the cloud</text>
  <rect class="sub" x="328" y="64" width="214" height="28" rx="6"/><text class="mono" x="340" y="83">thread · worktree fix-login</text>
  <rect class="sub" x="328" y="98" width="214" height="28" rx="6"/><text class="mono" x="340" y="117">thread · worktree new-chart</text>
  <rect class="sub" x="328" y="132" width="214" height="28" rx="6"/><text class="mono" x="340" y="151">thread · worktree docs</text>
  <text class="small" x="328" y="180">Agents use skills from your packs.</text>
  <path class="link" d="M435 192 V232"/>
  <rect class="node" x="310" y="232" width="250" height="68" rx="12"/>
  <text class="txt" x="328" y="258">Your hub, in the cloud</text>
  <text class="small" x="328" y="278">An always-on box that links the</text><text class="small" x="328" y="293">nodes and keeps pack secrets.</text>
  <rect class="node" x="590" y="40" width="150" height="130" rx="12"/>
  <text class="txt" x="606" y="68">Your profile</text>
  <rect class="sub" x="606" y="82" width="118" height="28" rx="6"/><text class="mono" x="616" y="101">&lt;login&gt;-hedge</text>
  <text class="small" x="606" y="134">A private GitHub repo</text><text class="small" x="606" y="150">with your answers.</text>
  <path class="optlink" d="M728 170 V316 H435 V300 M590 105 H560"/>
  <text class="small" x="588" y="190">Every cloud box reads it,</text><text class="small" x="588" y="206">so all of them match.</text>
</svg>
